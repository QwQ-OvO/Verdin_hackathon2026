  <text x="76" y="866" font-size="11" font-weight="400" fill="#687080">Learner workspace</text>
  <text x="274" y="48" font-size="13" font-weight="400" fill="#687080">Learner workspace  /  OB-0929  /  First judgement</text>
  <text x="274" y="108" font-size="29" font-weight="700" fill="#17191f">Which onboarding issues deserve investigation?</text>
  <text x="274" y="138" font-size="14" font-weight="400" fill="#687080">Read original feedback, decide on two priorities, and cite evidence before seeing AI conclusions.</text>
  <rect x="274" y="160" width="1128" height="62" rx="10" fill="#f1ebff"/>
