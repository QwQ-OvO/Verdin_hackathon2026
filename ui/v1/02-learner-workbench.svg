  <rect x="298" y="380" width="478" height="98" rx="8" fill="#fff" stroke="#e2e5ec"/>
  <text x="313" y="404" font-size="12" font-weight="700" fill="#687080">FB-014 · document upload</text>
  <text x="313" y="433" font-size="14" font-weight="400" fill="#17191f">“After upload the screen kept spinning.</text>
  <text x="313" y="456" font-size="14" font-weight="400" fill="#17191f">I could not tell if the file was submitted.”</text>
  <rect x="298" y="491" width="478" height="98" rx="8" fill="#fff" stroke="#e2e5ec"/>
  <text x="313" y="515" font-size="12" font-weight="700" fill="#687080">FB-021 · verification progress</text>
  <text x="313" y="544" font-size="14" font-weight="400" fill="#17191f">“Three days later I still cannot see progress</text>
  <text x="313" y="567" font-size="14" font-weight="400" fill="#17191f">or what I need to do next.”</text>
  <rect x="298" y="602" width="478" height="98" rx="8" fill="#fff" stroke="#e2e5ec"/>
  <text x="313" y="626" font-size="12" font-weight="700" fill="#687080">FB-036 · account activation</text>
  <text x="313" y="655" font-size="14" font-weight="400" fill="#17191f">“Verification passed, but the first-payment</text>
  <text x="313" y="678" font-size="14" font-weight="400" fill="#17191f">setup message suggests I cannot use it.”</text>
  <rect x="298" y="724" width="478" height="56" rx="7" fill="#f8f9fb"/>
  <text x="313" y="747" font-size="12" font-weight="700" fill="#17191f">AI organisation: duplicate group A → FB-014, FB-027</text>
  <text x="313" y="768" font-size="12" font-weight="400" fill="#612fff">Open every original before citing it  →</text>
  <rect x="819" y="241" width="583" height="573" rx="14" fill="#fff" stroke="#e2e5ec"/>
  <text x="843" y="279" font-size="18" font-weight="700" fill="#17191f">My first judgement</text>
  <text x="843" y="304" font-size="13" font-weight="400" fill="#687080">The first submission is saved as an immutable version.</text>
  <text x="844" y="335" font-size="12" font-weight="700" fill="#17191f">Problem patterns you see</text>
  <rect x="844" y="349" width="533" height="82" rx="7" fill="#fff" stroke="#e2e5ec"/>
  <text x="858" y="376" font-size="12" font-weight="400" fill="#687080">Which feedback describes the same obstacle?</text>
  <text x="844" y="462" font-size="12" font-weight="700" fill="#17191f">Priority 1 · issue, reason, source IDs</text>
  <rect x="844" y="476" width="533" height="76" rx="7" fill="#fff" stroke="#e2e5ec"/>
  <text x="858" y="503" font-size="12" font-weight="400" fill="#687080">Cite supporting and conflicting feedback IDs</text>
  <text x="844" y="583" font-size="12" font-weight="700" fill="#17191f">Priority 2 · issue, reason, source IDs</text>
  <rect x="844" y="597" width="533" height="76" rx="7" fill="#fff" stroke="#e2e5ec"/>
  <text x="858" y="624" font-size="12" font-weight="400" fill="#687080">Cite supporting and conflicting feedback IDs</text>
  <rect x="844" y="696" width="533" height="43" rx="7" fill="#f8f5ff"/>
  <text x="857" y="716" font-size="12" font-weight="700" fill="#612fff">Need a question hint? Ask once; it is logged for your manager.</text>
  <text x="857" y="732" font-size="11" font-weight="400" fill="#687080">No suggested categories or final answer before submission.</text>
  <text x="844" y="767" font-size="12" font-weight="700" fill="#687080">AI conclusions locked until first submission.</text>
  <rect x="1147" y="752" width="230" height="43" rx="8" fill="#612fff"/>
  <text x="1262.0" y="779" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Submit first judgement  →</text>
  <text x="274" y="863" font-size="12" font-weight="400" fill="#687080">Illustrative, de-identified task · Learning allocation does not change business approval rights</text>
