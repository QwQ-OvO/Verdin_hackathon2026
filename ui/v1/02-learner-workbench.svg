  <text x="406" y="198" font-size="15" font-weight="700" fill="#612fff">First judgement</text>
  <text x="720" y="198" font-size="12" font-weight="400" fill="#687080">Target: user insight · due 2 Oct, 17:00</text>
  <text x="1146" y="198" font-size="12" font-weight="700" fill="#612fff">Manager review required</text>
  <rect x="274" y="241" width="526" height="573" rx="14" fill="#fff" stroke="#e2e5ec"/>
  <text x="298" y="279" font-size="18" font-weight="700" fill="#17191f">Source material</text>
  <text x="298" y="304" font-size="13" font-weight="400" fill="#687080">De-identified demo set · AI removed duplicates, not judgement.</text>
  <rect x="298" y="323" width="478" height="38" rx="7" fill="#f6f7fa"/>
