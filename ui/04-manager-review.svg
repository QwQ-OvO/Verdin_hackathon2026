  <text x="1072" y="656" font-size="11" font-weight="400" fill="#687080">Prompted first judgement; reasoned revision.</text>
  <rect x="1072" y="674" width="306" height="59" rx="7" fill="#f1ebff"/>
  <text x="1085" y="698" font-size="12" font-weight="700" fill="#612fff">Proposed next support: level 1</text>
  <text x="1085" y="720" font-size="11" font-weight="400" fill="#687080">Validate on a new real task later.</text>
