<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Apprentice V2 — First judgement</title>
<desc id="desc">The learner sees original synthetic feedback and writes a first evidence-backed judgement before any AI issue conclusion is shown.</desc>
<!-- Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V5 · decision dossier -->
<defs><filter id="panel-shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#6a578e" flood-opacity=".10"/></filter></defs>
<style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;font-style:normal} .mono{font-family:Consolas,"Cascadia Code",monospace}</style>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#f7f5fb" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="232" height="900" rx="0" fill="#f0ecf8" stroke="none" stroke-width="1"/>
<rect x="24" y="26" width="36" height="36" rx="11" fill="#612fff" stroke="none" stroke-width="1"/>
<text x="42" y="51" font-size="20" fill="#ffffff" font-weight="800" text-anchor="middle">A</text>
<text x="71" y="47" font-size="18" fill="#211b35" font-weight="800">apprentice</text>
<text x="71" y="63" font-size="9" fill="#625c76" font-weight="600">TEAM VERDIN CONCEPT</text>
<path d="M16 105H216" stroke="#dcd5e9" stroke-width="1"/>
<text x="24" y="134" font-size="10" fill="#625c76" font-weight="800" letter-spacing="1.2">ONE REAL-WORK LOOP</text>
<text x="24" y="164" font-size="13" fill="#211b35" font-weight="700">Onboarding feedback</text>
<text x="24" y="205" font-size="10" fill="#625c76" font-weight="500" class="mono">TASK-ONB-001</text>
<path d="M16 226H216" stroke="#dcd5e9" stroke-width="1"/>
<text x="28" y="263" font-size="11" fill="#625c76" font-weight="700" class="mono">01</text>
<text x="56" y="263" font-size="13" fill="#625c76" font-weight="400">Allocate judgement</text>
<rect x="16" y="288" width="200" height="42" rx="21" fill="#ffffff" fill-opacity=".78" stroke="#dcd5e9" stroke-opacity=".8"/>
<text x="28" y="313" font-size="11" fill="#4d1fe1" font-weight="700" class="mono">02</text>
<text x="56" y="313" font-size="13" fill="#4d1fe1" font-weight="700">First judgement</text>
<text x="28" y="363" font-size="11" fill="#625c76" font-weight="700" class="mono">03</text>
<text x="56" y="363" font-size="13" fill="#625c76" font-weight="400">Manager review</text>
<path d="M16 820H216" stroke="#dcd5e9" stroke-width="1"/>
<circle cx="30" cy="846" r="4" fill="#087656"/>
<text x="43" y="850" font-size="11" fill="#211b35" font-weight="600">Prototype · synthetic data</text>
<text x="43" y="868" font-size="10" fill="#625c76" font-weight="400">No backend actions</text>
<rect x="232" y="0" width="1208" height="62" rx="0" fill="#ffffff" fill-opacity=".78" stroke="#dcd5e9" stroke-opacity=".8"/>
<path d="M232 62H1440" stroke="#dcd5e9" stroke-width="1"/>
<text x="264" y="37" font-size="12" fill="#625c76" font-weight="400">Apprentice   /   User insight   /</text>
<text x="477" y="37" font-size="12" fill="#211b35" font-weight="700">First judgement</text>
<rect x="1190" y="18" width="132" height="26" rx="13.0" fill="#eae4fb" stroke="none" stroke-width="1"/>
<text x="1256.0" y="35.0" font-size="11" fill="#4d1fe1" font-weight="700" text-anchor="middle">V2 SVG CONCEPT</text>
<text x="1342" y="36" font-size="10" fill="#625c76" font-weight="700" letter-spacing="1">LEARNER</text>
<text x="264" y="101" font-size="11" fill="#4d1fe1" font-weight="800" letter-spacing="1">LEARNER · AFTER MANAGER ALLOCATION</text>
<text x="264" y="147" font-size="35" fill="#211b35" font-weight="800">Make the first judgement yourself.</text>
<text x="264" y="179" font-size="14" fill="#625c76" font-weight="400">Name two issues worth investigating. Cite original comments and explain what remains uncertain.</text>
<rect x="264" y="202" width="1144" height="78" rx="18" fill="#ffffff" fill-opacity=".78" stroke="#dcd5e9" stroke-opacity=".8" filter="url(#panel-shadow)"/>
<rect x="284" y="219" width="160" height="26" rx="13.0" fill="#fff1d8" stroke="none" stroke-width="1"/>
<text x="364.0" y="236.0" font-size="11" fill="#91600f" font-weight="700" text-anchor="middle">SYNTHETIC DEMO MATERIAL</text>
<text x="456" y="237" font-size="17" fill="#211b35" font-weight="700">Onboarding feedback</text>
<text x="284" y="263" font-size="12" fill="#625c76" font-weight="400">Merchant onboarding · Recommend two issues with reasons and original feedback citations.</text>
<rect x="264" y="300" width="548" height="520" rx="20" fill="#ffffff" fill-opacity=".78" stroke="#dcd5e9" stroke-opacity=".8" filter="url(#panel-shadow)"/>
<text x="286" y="335" font-size="11" fill="#625c76" font-weight="800" letter-spacing="1">ORIGINAL SOURCE MATERIAL</text>
<text x="286" y="362" font-size="12" fill="#625c76" font-weight="400">AI may organize duplicates; each source stays open.</text>
<path d="M286 380H790" stroke="#dcd5e9" stroke-width="1"/>
<text x="286" y="400" font-size="10" fill="#4d1fe1" font-weight="800" letter-spacing="0.5">FB-014 · DOCUMENT UPLOAD</text>
<text x="286" y="427" font-size="13" fill="#211b35" font-weight="400">After upload the screen kept spinning. I could not</text>
<text x="286" y="447" font-size="13" fill="#211b35" font-weight="400">tell if the file was submitted.</text>
<path d="M286 478H790" stroke="#dcd5e9" stroke-width="1"/>
<text x="286" y="498" font-size="10" fill="#4d1fe1" font-weight="800" letter-spacing="0.5">FB-018 · CONTRARY EVIDENCE</text>
<text x="286" y="525" font-size="13" fill="#211b35" font-weight="400">My document upload showed a confirmation</text>
<text x="286" y="545" font-size="13" fill="#211b35" font-weight="400">immediately. I could see it had been received.</text>
<path d="M286 576H790" stroke="#dcd5e9" stroke-width="1"/>
<text x="286" y="596" font-size="10" fill="#4d1fe1" font-weight="800" letter-spacing="0.5">FB-021 · VERIFICATION REVIEW</text>
<text x="286" y="623" font-size="13" fill="#211b35" font-weight="400">Three days later I still cannot see progress</text>
<text x="286" y="643" font-size="13" fill="#211b35" font-weight="400">or what I need to do next.</text>
<path d="M286 674H790" stroke="#dcd5e9" stroke-width="1"/>
<text x="286" y="694" font-size="10" fill="#4d1fe1" font-weight="800" letter-spacing="0.5">FB-036 · ACCOUNT ACTIVATION</text>
<text x="286" y="721" font-size="13" fill="#211b35" font-weight="400">Verification passed, but the first-payment</text>
<text x="286" y="741" font-size="13" fill="#211b35" font-weight="400">setup message suggests I cannot use it.</text>
<rect x="834" y="300" width="574" height="520" rx="20" fill="#ffffff" fill-opacity=".78" stroke="#dcd5e9" stroke-opacity=".8" filter="url(#panel-shadow)"/>
<text x="856" y="335" font-size="11" fill="#625c76" font-weight="800" letter-spacing="1">FIRST VERSION · REQUIRED OUTPUT</text>
<text x="856" y="366" font-size="20" fill="#211b35" font-weight="700">Your investigation recommendation</text>
<text x="856" y="397" font-size="10" fill="#625c76" font-weight="800" letter-spacing="0.7">OBSERVED PATTERNS</text>
<rect x="856" y="407" width="530" height="64" rx="10" fill="#ffffff" fill-opacity=".78" stroke="#dcd5e9" stroke-opacity=".8"/>
<text x="870" y="436" font-size="12" fill="#9299a8" font-weight="400">Distinguish stages and note a possible pattern…</text>
<text x="856" y="488" font-size="10" fill="#625c76" font-weight="800" letter-spacing="0.7">PRIORITY 1</text>
<rect x="856" y="498" width="530" height="60" rx="10" fill="#ffffff" fill-opacity=".78" stroke="#dcd5e9" stroke-opacity=".8"/>
<text x="870" y="527" font-size="12" fill="#9299a8" font-weight="400">Issue, reason and original feedback IDs…</text>
<text x="856" y="575" font-size="10" fill="#625c76" font-weight="800" letter-spacing="0.7">PRIORITY 2</text>
<rect x="856" y="585" width="530" height="60" rx="10" fill="#ffffff" fill-opacity=".78" stroke="#dcd5e9" stroke-opacity=".8"/>
<text x="870" y="614" font-size="12" fill="#9299a8" font-weight="400">A second issue with supporting evidence…</text>
<text x="856" y="662" font-size="10" fill="#625c76" font-weight="800" letter-spacing="0.7">COUNTEREVIDENCE AND UNCERTAINTY</text>
<rect x="856" y="672" width="530" height="60" rx="10" fill="#ffffff" fill-opacity=".78" stroke="#dcd5e9" stroke-opacity=".8"/>
<text x="870" y="701" font-size="12" fill="#9299a8" font-weight="400">What could change your recommendation?</text>
<rect x="856" y="747" width="530" height="52" rx="10" fill="#eae4fb" stroke="none" stroke-width="1"/>
<text x="872" y="768" font-size="10" fill="#4d1fe1" font-weight="800" letter-spacing="0.7">PROTECTED GATE</text>
<text x="872" y="788" font-size="11" fill="#4d1fe1" font-weight="600">No AI issue ranking or conclusion before first submission.</text>
<text x="264" y="857" font-size="12" fill="#625c76" font-weight="400">The first version is saved before post-submission evidence checks become available.</text>
</svg>
