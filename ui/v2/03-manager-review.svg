<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Skill Gym V2 — Planned manager review</title>
<desc id="desc">A planned flow where the manager reviews the first judgement, help and revisions, then separately decides business use and records capability evidence for the next task.</desc>
<!-- Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V5 · decision dossier -->
<defs><filter id="panel-shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#6a578e" flood-opacity=".10"/></filter></defs>
<style>svg{--font-display:"Bahnschrift SemiCondensed",Bahnschrift,"Arial Narrow",sans-serif;--font-body:"Segoe UI",Arial,sans-serif;--font-mono:"Cascadia Code",Consolas,monospace} text{font-family:var(--font-body);font-style:normal}.display{font-family:var(--font-display)}.mono{font-family:var(--font-mono)}</style>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#f7f5fb" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="232" height="900" rx="0" fill="#f0ecf8" stroke="none" stroke-width="1"/>
<rect x="24" y="26" width="36" height="36" rx="11" fill="#612fff" stroke="none" stroke-width="1"/>
<text x="42" y="50" font-size="13" fill="#ffffff" font-weight="800" text-anchor="middle">SG</text>
<text x="71" y="47" font-size="18" fill="#211b35" font-weight="800" class="display">Skill Gym</text>
<text x="71" y="63" font-size="9" fill="#625c76" font-weight="600">TEAM VERDIN CONCEPT</text>
<path d="M16 105H216" stroke="#dcd5e9" stroke-width="1"/>
<text x="24" y="134" font-size="10" fill="#625c76" font-weight="800" letter-spacing="1.2">ONE REAL-WORK LOOP</text>
<text x="24" y="164" font-size="13" fill="#211b35" font-weight="700">Onboarding feedback</text>
<text x="24" y="205" font-size="10" fill="#625c76" font-weight="500" class="mono">TASK-ONB-001</text>
<path d="M16 226H216" stroke="#dcd5e9" stroke-width="1"/>
<text x="28" y="263" font-size="11" fill="#625c76" font-weight="700" class="mono">01</text>
<text x="56" y="263" font-size="13" fill="#625c76" font-weight="400">Allocate judgement</text>
<text x="28" y="313" font-size="11" fill="#625c76" font-weight="700" class="mono">02</text>
<text x="56" y="313" font-size="13" fill="#625c76" font-weight="400">First judgement</text>
<rect x="16" y="338" width="200" height="42" rx="21" fill="#ffffff" fill-opacity=".78" stroke="#dcd5e9" stroke-opacity=".8"/>
<text x="28" y="363" font-size="11" fill="#4d1fe1" font-weight="700" class="mono">03</text>
<text x="56" y="363" font-size="13" fill="#4d1fe1" font-weight="700">Manager review</text>
<path d="M16 820H216" stroke="#dcd5e9" stroke-width="1"/>
<circle cx="30" cy="846" r="4" fill="#087656"/>
<text x="43" y="850" font-size="11" fill="#211b35" font-weight="600">Prototype · synthetic data</text>
<text x="43" y="868" font-size="10" fill="#625c76" font-weight="400">No backend actions</text>
<rect x="232" y="0" width="1208" height="62" rx="0" fill="#ffffff" fill-opacity=".78" stroke="#dcd5e9" stroke-opacity=".8"/>
<path d="M232 62H1440" stroke="#dcd5e9" stroke-width="1"/>
<text x="264" y="37" font-size="12" fill="#625c76" font-weight="400">Skill Gym   /   User insight   /</text>
<text x="478" y="37" font-size="12" fill="#211b35" font-weight="700">Manager review</text>
<rect x="1190" y="18" width="132" height="26" rx="13.0" fill="#eae4fb" stroke="none" stroke-width="1"/>
<text x="1256.0" y="35.0" font-size="11" fill="#4d1fe1" font-weight="700" text-anchor="middle">V2 SVG CONCEPT</text>
<text x="1342" y="36" font-size="10" fill="#625c76" font-weight="700" letter-spacing="1">MANAGER</text>
<text x="264" y="101" font-size="11" fill="#4d1fe1" font-weight="800" letter-spacing="1">PLANNED FLOW · MANAGER REVIEW</text>
<text x="264" y="147" font-size="35" fill="#211b35" font-weight="800" class="display">Review the work. Record the learning.</text>
<text x="264" y="179" font-size="14" fill="#625c76" font-weight="400">The current backend stops after first judgement and hints; this review flow is planned.</text>
<rect x="264" y="202" width="1144" height="78" rx="18" fill="#ffffff" fill-opacity=".78" stroke="#dcd5e9" stroke-opacity=".8" filter="url(#panel-shadow)"/>
<rect x="284" y="219" width="160" height="26" rx="13.0" fill="#fff1d8" stroke="none" stroke-width="1"/>
<text x="364.0" y="236.0" font-size="11" fill="#91600f" font-weight="700" text-anchor="middle">SYNTHETIC DEMO MATERIAL</text>
<text x="456" y="237" font-size="17" fill="#211b35" font-weight="700">Onboarding feedback</text>
<text x="284" y="263" font-size="12" fill="#625c76" font-weight="400">Merchant onboarding · Recommend two issues with reasons and original feedback citations.</text>
<rect x="264" y="300" width="650" height="520" rx="20" fill="#ffffff" fill-opacity=".78" stroke="#dcd5e9" stroke-opacity=".8" filter="url(#panel-shadow)"/>
<text x="286" y="335" font-size="11" fill="#625c76" font-weight="800" letter-spacing="1">PROPOSED JUDGEMENT TRAIL</text>
<text x="286" y="362" font-size="12" fill="#625c76" font-weight="400">The saved first version stays protected; revisions are planned.</text>
<path d="M301 395L301 741" stroke="#eae4fb" stroke-width="3" fill="none"/>
<circle cx="301" cy="410" r="13" fill="#612fff"/>
<text x="301" y="414" font-size="9" fill="#ffffff" font-weight="800" text-anchor="middle" class="mono">01</text>
<text x="329" y="414" font-size="16" fill="#211b35" font-weight="700">First judgement · protected</text>
<rect x="329" y="427" width="559" height="72" rx="12" fill="#f1edf8" stroke="none" stroke-width="1"/>
<text x="345" y="455" font-size="12" fill="#625c76" font-weight="400">Two investigation priorities, reasons and</text>
<text x="345" y="473" font-size="12" fill="#625c76" font-weight="400">original citations from synthetic feedback.</text>
<circle cx="301" cy="530" r="13" fill="#612fff"/>
<text x="301" y="534" font-size="9" fill="#ffffff" font-weight="800" text-anchor="middle" class="mono">02</text>
<text x="329" y="534" font-size="16" fill="#211b35" font-weight="700">Help and evidence check</text>
<rect x="329" y="547" width="559" height="72" rx="12" fill="#f1edf8" stroke="none" stroke-width="1"/>
<text x="345" y="575" font-size="12" fill="#625c76" font-weight="400">AI may flag a missing or conflicting source</text>
<text x="345" y="593" font-size="12" fill="#625c76" font-weight="400">after the first version is saved.</text>
<circle cx="301" cy="650" r="13" fill="#612fff"/>
<text x="301" y="654" font-size="9" fill="#ffffff" font-weight="800" text-anchor="middle" class="mono">03</text>
<text x="329" y="654" font-size="16" fill="#211b35" font-weight="700">Learner revision · planned</text>
<rect x="329" y="667" width="559" height="72" rx="12" fill="#f1edf8" stroke="none" stroke-width="1"/>
<text x="345" y="695" font-size="12" fill="#625c76" font-weight="400">Changed claim and reasons would be appended.</text>
<text x="345" y="713" font-size="12" fill="#625c76" font-weight="400">Version 1 would never be overwritten.</text>
<rect x="936" y="300" width="472" height="248" rx="20" fill="#ffffff" fill-opacity=".78" stroke="#dcd5e9" stroke-opacity=".8" filter="url(#panel-shadow)"/>
<text x="958" y="334" font-size="11" fill="#625c76" font-weight="800" letter-spacing="1">PLANNED / BUSINESS OUTPUT</text>
<text x="958" y="369" font-size="18" fill="#211b35" font-weight="700" class="display">Approve or return the recommendation</text>
<text x="958" y="397" font-size="12" fill="#625c76" font-weight="400">Approval allows product discovery discussion only.</text>
<text x="958" y="416" font-size="12" fill="#625c76" font-weight="400">It does not authorize verification or risk-rule changes.</text>
<text x="958" y="458" font-size="10" fill="#625c76" font-weight="800" letter-spacing="0.8">MANAGER FEEDBACK</text>
<rect x="958" y="470" width="428" height="55" rx="10" fill="#ffffff" fill-opacity=".78" stroke="#dcd5e9" stroke-opacity=".8"/>
<text x="972" y="495" font-size="12" fill="#797386" font-weight="400">Review citations, reasoning and uncertainty…</text>
<rect x="936" y="568" width="472" height="252" rx="20" fill="#ffffff" fill-opacity=".78" stroke="#dcd5e9" stroke-opacity=".8" filter="url(#panel-shadow)"/>
<text x="958" y="602" font-size="11" fill="#625c76" font-weight="800" letter-spacing="1">PLANNED / CAPABILITY EVIDENCE</text>
<text x="958" y="637" font-size="18" fill="#211b35" font-weight="700" class="display">Plan support for the next task</text>
<text x="958" y="664" font-size="12" fill="#625c76" font-weight="400">Record source use, judgement quality and help used.</text>
<text x="958" y="683" font-size="12" fill="#625c76" font-weight="400">One approved result does not establish mastery.</text>
<rect x="958" y="713" width="428" height="38" rx="10" fill="#f1edf8" stroke="#dcd5e9" stroke-width="1"/>
<text x="972" y="737" font-size="12" fill="#211b35" font-weight="600">Maintain support   ▾</text>
<text x="958" y="786" font-size="11" fill="#4d1fe1" font-weight="700">Manager confirms with a reason.</text>
<text x="264" y="855" font-size="12" fill="#625c76" font-weight="400">Optional later enhancement: AI may draft feedback, but it never replaces manager review.</text>
</svg>
