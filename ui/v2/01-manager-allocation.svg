<text x="264" y="147" font-size="35" fill="#211b35" font-weight="800" class="display">Which judgement should remain human?</text>
<text x="264" y="179" font-size="14" fill="#625c76" font-weight="400">The manager decides where automation helps and where real work still develops expertise.</text>
