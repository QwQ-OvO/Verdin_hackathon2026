  <text x="1377" y="458" font-size="12" font-weight="700" fill="#17191f" text-anchor="end">Product Manager</text>
  <path d="M1057 471H1378" stroke="#e2e5ec"/>
  <rect x="1057" y="491" width="321" height="23" rx="5" fill="#fff7e8"/>
  <text x="1066" y="507" font-size="11" font-weight="400" fill="#8b5a12">Risk-rule changes require separate approval.</text>
  <rect x="1033" y="541" width="369" height="277" rx="14" fill="#fff" stroke="#e2e5ec"/>
  <text x="1057" y="579" font-size="18" font-weight="700" fill="#17191f">Manager confirmation</text>
  <text x="1057" y="604" font-size="13" font-weight="400" fill="#687080">Confirm learner judgement and final review boundary.</text>
  <text x="1057" y="620" font-size="12" font-weight="700" fill="#17191f">Override reason</text>
  <rect x="1057" y="631" width="321" height="67" rx="7" fill="#fff" stroke="#e2e5ec"/>
  <text x="1071" y="657" font-size="12" font-weight="400" fill="#687080">Required if any suggested owner changes</text>
  <text x="1057" y="724" font-size="12" font-weight="400" fill="#687080">Final output cannot publish before your review.</text>
  <rect x="1057" y="747" width="321" height="43" rx="8" fill="#612fff"/>
  <text x="1217.5" y="774" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Confirm allocation &amp; assign task</text>
  <text x="274" y="863" font-size="12" font-weight="400" fill="#687080">Illustrative, de-identified task · Learning allocation does not change business approval rights</text>
  <text x="1330" y="863" font-size="12" font-weight="400" fill="#687080" text-anchor="end">01 / 04</text>
