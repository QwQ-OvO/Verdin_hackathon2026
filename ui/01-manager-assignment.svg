  <text x="407" y="199" font-size="16" font-weight="700" fill="#17191f">Merchant onboarding feedback review</text>
  <text x="294" y="232" font-size="12" font-weight="400" fill="#687080">Source: Product Onboarding backlog · Batch OB-0929 · demo feedback set</text>
  <text x="1170" y="190" font-size="11" font-weight="700" fill="#687080">DUE</text>
  <text x="1170" y="216" font-size="14" font-weight="700" fill="#17191f">2 Oct · 17:00</text>
  <rect x="274" y="270" width="741" height="548" rx="14" fill="#fff" stroke="#e2e5ec"/>
  <text x="298" y="308" font-size="18" font-weight="700" fill="#17191f">Step allocation</text>
  <text x="298" y="333" font-size="13" font-weight="400" fill="#687080">Capability target: User insight  ⌄   ·   Identify patterns and evidence-based priorities.</text>
  <path d="M298 351H991" stroke="#e2e5ec"/>
  <text x="298" y="377" font-size="11" font-weight="700" fill="#687080">WORK STEP</text>
  <text x="607" y="377" font-size="11" font-weight="700" fill="#687080">OWNER · EDITABLE</text>
  <text x="780" y="377" font-size="11" font-weight="700" fill="#687080">WHY THIS STEP</text>
  <path d="M298 392H991" stroke="#e2e5ec"/>
  <text x="298" y="431" font-size="14" font-weight="700" fill="#17191f">01  Prepare source material</text>
  <text x="298" y="455" font-size="12" font-weight="400" fill="#687080">Deduplicate and preserve source IDs</text>
  <rect x="605" y="418" width="140" height="28" rx="14" fill="#f1ebff"/>
  <text x="675.0" y="437" font-size="12" font-weight="700" fill="#612fff" text-anchor="middle">AI prepares</text>
  <text x="743" y="437" font-size="16" font-weight="700" fill="#687080">⌄</text>
  <text x="780" y="433" font-size="12" font-weight="400" fill="#17191f">Efficient; source text retained.</text>
  <path d="M298 486H991" stroke="#e2e5ec"/>
  <text x="298" y="524" font-size="14" font-weight="700" fill="#17191f">02  Identify problem patterns</text>
  <text x="298" y="548" font-size="12" font-weight="400" fill="#687080">Group feedback into possible obstacles</text>
  <rect x="605" y="511" width="140" height="28" rx="14" fill="#e7f6ef"/>
  <text x="675.0" y="530" font-size="12" font-weight="700" fill="#087656" text-anchor="middle">Learner judges</text>
  <text x="743" y="530" font-size="16" font-weight="700" fill="#687080">⌄</text>
  <text x="780" y="526" font-size="12" font-weight="400" fill="#17191f">Practises the current skill gap.</text>
  <path d="M298 579H991" stroke="#e2e5ec"/>
  <text x="298" y="617" font-size="14" font-weight="700" fill="#17191f">03  Choose two priorities</text>
  <text x="298" y="641" font-size="12" font-weight="400" fill="#687080">Explain trade-offs and cite source IDs</text>
  <rect x="605" y="604" width="140" height="28" rx="14" fill="#e7f6ef"/>
  <text x="675.0" y="623" font-size="12" font-weight="700" fill="#087656" text-anchor="middle">Learner judges</text>
  <text x="743" y="623" font-size="16" font-weight="700" fill="#687080">⌄</text>
  <text x="780" y="619" font-size="12" font-weight="400" fill="#17191f">Key judgement stays with the learner.</text>
  <path d="M298 672H991" stroke="#e2e5ec"/>
  <text x="298" y="710" font-size="14" font-weight="700" fill="#17191f">04  Approve business use</text>
  <text x="298" y="734" font-size="12" font-weight="400" fill="#687080">Review evidence before any team decision</text>
  <rect x="605" y="697" width="140" height="28" rx="14" fill="#f0f1f4"/>
  <text x="675.0" y="716" font-size="12" font-weight="700" fill="#535d6b" text-anchor="middle">Manager approves</text>
  <text x="743" y="716" font-size="16" font-weight="700" fill="#687080">⌄</text>
  <text x="780" y="712" font-size="12" font-weight="400" fill="#17191f">Final approval stays with manager.</text>
  <path d="M298 765H991" stroke="#e2e5ec"/>
  <rect x="298" y="784" width="693" height="20" rx="4" fill="#f8f5ff"/>
  <text x="308" y="798" font-size="11" font-weight="400" fill="#612fff">Manager can override an owner; the reason is saved with the proposal.</text>
  <rect x="1033" y="270" width="369" height="253" rx="14" fill="#fff" stroke="#e2e5ec"/>
  <text x="1057" y="308" font-size="18" font-weight="700" fill="#17191f">Decision checks</text>
  <text x="1057" y="338" font-size="12" font-weight="400" fill="#687080">Capability evidence</text>
  <text x="1377" y="338" font-size="12" font-weight="700" fill="#17191f" text-anchor="end">Needs pattern practice</text>
  <path d="M1057 351H1378" stroke="#e2e5ec"/>
  <text x="1057" y="378" font-size="12" font-weight="400" fill="#687080">Business risk</text>
  <text x="1377" y="378" font-size="12" font-weight="700" fill="#17191f" text-anchor="end">Moderate · reversible</text>
  <path d="M1057 391H1378" stroke="#e2e5ec"/>
  <text x="1057" y="418" font-size="12" font-weight="400" fill="#687080">Access</text>
  <text x="1377" y="418" font-size="12" font-weight="700" fill="#17191f" text-anchor="end">De-identified only</text>
  <path d="M1057 431H1378" stroke="#e2e5ec"/>
