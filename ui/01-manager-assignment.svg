  <text x="274" y="48" font-size="13" font-weight="400" fill="#687080">Manager workspace  /  OB-0929  /  Confirm allocation</text>
  <text x="274" y="108" font-size="29" font-weight="700" fill="#17191f">Confirm learning in a real task</text>
  <text x="274" y="138" font-size="14" font-weight="400" fill="#687080">Transparent step rules propose who works, who can help, and who approves.</text>
  <rect x="274" y="161" width="1128" height="91" rx="12" fill="#fff" stroke="#e2e5ec"/>
  <rect x="294" y="179" width="102" height="28" rx="14" fill="#e7f6ef"/>
