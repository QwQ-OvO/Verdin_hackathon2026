  <path d="M24 815H208" stroke="#e7e8ed"/><circle cx="47" cy="852" r="18" fill="#e9e0ff"/><text x="47" y="857" text-anchor="middle" class="purple bold small">林</text><text x="76" y="848" class="bold small">林分析师</text><text x="76" y="866" class="muted" font-size="11">Product · Junior</text>
  <text x="274" y="48" class="muted small">我的任务  /  OB-0929  /  提示与修订</text>
  <text x="274" y="107" font-size="29" font-weight="700">重新检查你的判断</text><text x="274" y="138" class="muted body">首次版本已保存。现在可以利用提示检查遗漏，并说明判断为何改变。</text>
  <rect x="274" y="160" width="1128" height="64" rx="11" fill="#f1ebff"/><circle cx="303" cy="192" r="12" fill="#612fff"/><text x="303" y="197" text-anchor="middle" class="white bold small">2</text><text x="327" y="197" class="purple bold body">当前阶段：证据检查与修订</text><text x="771" y="197" class="muted small">首次判断已于 09:42 保存</text><text x="1202" y="197" class="muted small">提示已用 1 / 3</text>
  <rect x="274" y="244" width="351" height="570" rx="14" fill="#fff" stroke="#e5e7ec"/><text x="298" y="281" font-size="18" font-weight="700">首次判断 · 只读</text><text x="298" y="307" class="muted small">版本 1 · 09:42 · 已锁定</text>
  <path d="M298 327H601" stroke="#eceef2"/>
  <text x="298" y="361" class="muted label">问题模式</text><text x="298" y="390" class="body">验证资料提交后的状态不清楚，</text><text x="298" y="413" class="body">使商户重复尝试上传。</text>
  <text x="298" y="464" class="muted label">优先调查 01</text><text x="298" y="492" class="bold body">资料上传后的提交反馈</text><text x="298" y="518" class="muted small">依据：FB-014、FB-018、FB-027</text>
  <text x="298" y="566" class="muted label">优先调查 02</text><text x="298" y="594" class="bold body">验证进度的可见性</text><text x="298" y="620" class="muted small">依据：FB-021、FB-024</text>
  <rect x="298" y="674" width="303" height="96" rx="8" fill="#f7f8fa"/><text x="313" y="700" class="muted small">本次首次提交前使用过：</text><text x="313" y="729" class="bold small">一级反思问题 · 1 次</text><text x="313" y="752" class="muted small">因此标记为“有提示的首次判断”</text>
  <rect x="643" y="244" width="365" height="570" rx="14" fill="#fff" stroke="#e5e7ec"/><text x="668" y="281" font-size="18" font-weight="700">AI 证据检查</text><text x="668" y="307" class="muted small">只指出证据风险；业务结论由主管审核。</text>
  <rect x="668" y="333" width="315" height="110" rx="9" fill="#fff8ed" stroke="#f1dbaa"/><text x="684" y="360" fill="#8b5a12" font-size="13" font-weight="700">可能遗漏</text><text x="684" y="389" class="small">FB-036 提到“已通过验证”后的</text><text x="684" y="412" class="small">首次收款设置，可能是另一阶段。</text>
  <rect x="668" y="455" width="315" height="119" rx="9" fill="#f6f2ff" stroke="#ded2ff"/><text x="684" y="482" class="purple bold small">相互矛盾的证据</text><text x="684" y="511" class="small">FB-018 显示上传成功提示正常，</text><text x="684" y="534" class="small">但后续状态仍不清楚。两者是否</text><text x="684" y="557" class="small">应归为同一个问题？</text>
  <text x="668" y="622" class="muted label">按需获取更多帮助</text><rect x="668" y="639" width="315" height="46" rx="8" fill="#fff" stroke="#cbb9ff"/><text x="825" y="667" text-anchor="middle" class="purple bold small">查看二级线索</text><text x="668" y="714" class="muted small">每次帮助都会记录并向主管展示。</text>
  <rect x="1026" y="244" width="376" height="570" rx="14" fill="#fff" stroke="#e5e7ec"/><text x="1051" y="281" font-size="18" font-weight="700">修订版本 · 草稿</text><text x="1051" y="307" class="muted small">保留你的首次判断；仅提交新的版本。</text>
  <text x="1051" y="354" class="bold small">调整后的问题模式</text><rect x="1051" y="368" width="326" height="94" rx="8" fill="#fff" stroke="#dfe2e8"/><text x="1065" y="396" class="body">上传反馈与后续进度可能是</text><text x="1065" y="422" class="body">两个不同阶段的障碍。</text>
  <text x="1051" y="505" class="bold small">你为什么改变判断？</text><rect x="1051" y="519" width="326" height="112" rx="8" fill="#fff" stroke="#dfe2e8"/><text x="1065" y="547" class="muted small">引用新证据，说明哪些假设需要核实…</text>
  <rect x="1051" y="659" width="326" height="45" rx="8" fill="#f6f7fa"/><text x="1065" y="687" class="muted small">原始证据引用：FB-014 · FB-021 · + 添加</text>
  <rect x="1051" y="736" width="326" height="51" rx="8" fill="#612fff"/><text x="1214" y="768" text-anchor="middle" class="white bold body">提交修订，交由主管审核  →</text>
