<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#17191f}.muted{fill:#737987}.small{font-size:13px}.label{font-size:12px;font-weight:700;letter-spacing:1px}.body{font-size:15px}.bold{font-weight:700}.white{fill:#fff}.purple{fill:#612fff}</style>
