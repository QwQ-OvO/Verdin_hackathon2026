<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Product architecture for junior employee development</title>
  <desc id="desc">Four parts: junior employee workspace, manager workspace, allocation and evidence engine, and platform safeguards. Future expansion is outside MVP.</desc>
  <defs>
    <style>text{font-family:Inter,Arial,sans-serif;fill:#191a22}.title{font-size:44px;font-weight:750}.section{font-size:27px;font-weight:700}.tile{font-size:20px;font-weight:560}.meta{font-size:17px;fill:#697080}.small{font-size:16px;fill:#697080}.num{font-size:34px;font-weight:800;fill:#5ebda6}</style>
    <linearGradient id="mint" x2="1" y2="1"><stop stop-color="#f0fcf8"/><stop offset="1" stop-color="#dff5ee"/></linearGradient>
    <linearGradient id="lav" x2="1" y2="1"><stop stop-color="#f4f2ff"/><stop offset="1" stop-color="#e9e8ff"/></linearGradient>
    <linearGradient id="warm" x2="1" y2="1"><stop stop-color="#fbfaf8"/><stop offset="1" stop-color="#f1eeea"/></linearGradient>
  </defs>
  <rect width="1600" height="980" fill="#fff"/>
  <text x="119" y="112" class="title">Product Architecture | Junior Employee Development</text>
  <text x="119" y="150" class="meta">Automate the work. Preserve the judgement.</text>

  <rect x="120" y="190" width="660" height="290" rx="18" fill="url(#mint)" stroke="#58bea8" stroke-width="2"/>
  <rect x="260" y="205" width="380" height="44" rx="22" fill="#fff" stroke="#cfece3"/><text x="450" y="234" text-anchor="middle" class="section" font-size="24">Junior employee workspace</text>
  <rect x="145" y="270" width="294" height="58" rx="9" fill="#fff" stroke="#d5e8e2"/><text x="292" y="307" text-anchor="middle" class="tile">Task goal &amp; source material</text>
  <rect x="461" y="270" width="294" height="58" rx="9" fill="#fff" stroke="#d5e8e2"/><text x="608" y="307" text-anchor="middle" class="tile">Original feedback &amp; citations</text>
  <rect x="145" y="341" width="294" height="58" rx="9" fill="#fff" stroke="#d5e8e2"/><text x="292" y="378" text-anchor="middle" class="tile">First judgement, saved</text>
  <rect x="461" y="341" width="294" height="58" rx="9" fill="#fff" stroke="#d5e8e2"/><text x="608" y="378" text-anchor="middle" class="tile">Hints &amp; evidence check</text>
  <rect x="145" y="412" width="294" height="45" rx="9" fill="#fff" stroke="#d5e8e2"/><text x="292" y="442" text-anchor="middle" class="tile">Reasoned revision</text>
  <rect x="461" y="412" width="294" height="45" rx="9" fill="#fff" stroke="#d5e8e2"/><text x="608" y="442" text-anchor="middle" class="tile">Next-context validation</text>

  <rect x="802" y="190" width="660" height="290" rx="18" fill="url(#lav)" stroke="#a49cff" stroke-width="2"/>
  <rect x="950" y="205" width="364" height="44" rx="22" fill="#fff" stroke="#dad6ff"/><text x="1132" y="234" text-anchor="middle" class="section" font-size="24">Manager workspace</text>
  <rect x="827" y="270" width="294" height="58" rx="9" fill="#fff" stroke="#e0ddf5"/><text x="974" y="307" text-anchor="middle" class="tile">Real task &amp; review criteria</text>
  <rect x="1143" y="270" width="294" height="58" rx="9" fill="#fff" stroke="#e0ddf5"/><text x="1290" y="307" text-anchor="middle" class="tile">Capability target</text>
  <rect x="827" y="341" width="294" height="58" rx="9" fill="#fff" stroke="#e0ddf5"/><text x="974" y="378" text-anchor="middle" class="tile">Confirm step allocation</text>
  <rect x="1143" y="341" width="294" height="58" rx="9" fill="#fff" stroke="#e0ddf5"/><text x="1290" y="378" text-anchor="middle" class="tile">Set approval boundary</text>
  <rect x="827" y="412" width="294" height="45" rx="9" fill="#fff" stroke="#e0ddf5"/><text x="974" y="442" text-anchor="middle" class="tile">Review judgement trail</text>
  <rect x="1143" y="412" width="294" height="45" rx="9" fill="#fff" stroke="#e0ddf5"/><text x="1290" y="442" text-anchor="middle" class="tile">Approve business output</text>

  <rect x="120" y="502" width="660" height="290" rx="18" fill="url(#mint)" stroke="#58bea8" stroke-width="2"/>
  <rect x="274" y="517" width="352" height="44" rx="22" fill="#fff" stroke="#cfece3"/><text x="450" y="546" text-anchor="middle" class="section" font-size="24">Allocation &amp; evidence engine</text>
  <rect x="145" y="582" width="294" height="58" rx="9" fill="#fff" stroke="#d5e8e2"/><text x="292" y="619" text-anchor="middle" class="tile">Rule-based step proposal</text>
  <rect x="461" y="582" width="294" height="58" rx="9" fill="#fff" stroke="#d5e8e2"/><text x="608" y="619" text-anchor="middle" class="tile">Risk &amp; readiness checks</text>
  <rect x="145" y="653" width="294" height="58" rx="9" fill="#fff" stroke="#d5e8e2"/><text x="292" y="690" text-anchor="middle" class="tile">Version &amp; hint history</text>
  <rect x="461" y="653" width="294" height="58" rx="9" fill="#fff" stroke="#d5e8e2"/><text x="608" y="690" text-anchor="middle" class="tile">Manager-reviewed evidence</text>
  <rect x="145" y="724" width="610" height="45" rx="9" fill="#fff" stroke="#d5e8e2"/><text x="450" y="754" text-anchor="middle" class="tile">Recommend support for the next real task</text>

  <rect x="802" y="502" width="660" height="290" rx="18" fill="url(#warm)" stroke="#c8c2bc" stroke-width="2"/>
  <rect x="967" y="517" width="330" height="44" rx="22" fill="#fff" stroke="#dedad5"/><text x="1132" y="546" text-anchor="middle" class="section" font-size="24">Platform safeguards</text>
  <rect x="827" y="582" width="294" height="58" rx="9" fill="#fff" stroke="#e6e2df"/><text x="974" y="619" text-anchor="middle" class="tile">Roles &amp; data access</text>
  <rect x="1143" y="582" width="294" height="58" rx="9" fill="#fff" stroke="#e6e2df"/><text x="1290" y="619" text-anchor="middle" class="tile">De-identified task material</text>
  <rect x="827" y="653" width="294" height="58" rx="9" fill="#fff" stroke="#e6e2df"/><text x="974" y="690" text-anchor="middle" class="tile">Server-side AI controls</text>
  <rect x="1143" y="653" width="294" height="58" rx="9" fill="#fff" stroke="#e6e2df"/><text x="1290" y="690" text-anchor="middle" class="tile">Approval &amp; audit trail</text>
  <rect x="827" y="724" width="610" height="45" rx="9" fill="#fff" stroke="#e6e2df"/><text x="1132" y="754" text-anchor="middle" class="tile">First judgement cannot be overwritten</text>

  <rect x="120" y="815" width="1342" height="83" rx="13" fill="#fafbfc" stroke="#d7dce4" stroke-dasharray="7 5"/>
  <text x="158" y="851" class="section" font-size="21" fill="#5a5d66">Later expansion</text><text x="379" y="851" class="tile">Cross-team matching · More roles · Deeper integrations · Career planning</text>
  <text x="158" y="880" class="small">MVP: one capability, one real task, one junior employee and one manager; all business decisions remain under manager review.</text>
  <text x="790" y="938" text-anchor="middle" class="small">A supervised real-work learning loop—not automatic certification or autonomous business approval.</text>
</svg>
