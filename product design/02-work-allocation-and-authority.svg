<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">Work allocation</title>
<desc id="desc">Each real task is evaluated for learning value and business constraints. The result is available for automation, reserved for the junior employee, or senior-led.</desc>
<defs><style>text{font-family:Inter,Arial,sans-serif;fill:#1d1f28}.title{font-size:42px;font-weight:750}.head{font-size:28px;font-weight:740}.row{font-size:20px;font-weight:600}.detail{font-size:17px;fill:#686d7b}.small{font-size:16px;fill:#686d7b}.purple{fill:#563fbb}.brown{fill:#80552a}.green{fill:#15765f}.card{font-size:22px;font-weight:700}</style><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L12 5L0 10" fill="#555a65"/></marker></defs>
<rect width="1600" height="960" fill="#fff"/>
<text x="800" y="82" class="title" text-anchor="middle">Work Allocation</text>
<text x="800" y="119" class="detail" text-anchor="middle">Evaluate each real task to decide who should do it, based on learning value and business needs.</text>
<rect x="60" y="157" width="440" height="96" rx="13" fill="#f5f3f0" stroke="#c9c4bf"/>
<text x="90" y="195" class="head">Real work task</text><text x="90" y="224" class="detail">Task details, context, priority, risk...</text>
<line x1="510" y1="205" x2="565" y2="205" stroke="#555a65" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="580" y="157" width="440" height="96" rx="13" fill="#f0eeff" stroke="#9c90f7"/>
<text x="610" y="195" class="head">Evaluate and allocate</text><text x="610" y="224" class="detail">Learning value + business constraints</text>
<line x1="1030" y1="205" x2="1085" y2="205" stroke="#555a65" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1100" y="157" width="440" height="96" rx="13" fill="#e9f8f2" stroke="#68bda3"/>
<text x="1130" y="195" class="head">Allocation result</text><text x="1130" y="224" class="detail">Junior employee / automation / senior-led</text>
<rect x="60" y="289" width="720" height="390" rx="16" fill="#f5f4ff" stroke="#a89dff"/>
<circle cx="104" cy="334" r="24" fill="#dad5ff"/><text x="104" y="344" class="head purple" text-anchor="middle">A</text>
<text x="146" y="343" class="head">Learning value (for the junior employee)</text>
<text x="88" y="372" class="detail">How much can this task help the junior employee develop?</text>
<rect x="88" y="400" width="290" height="51" rx="8" fill="#fff" stroke="#dedaf5"/><text x="233" y="433" class="row" text-anchor="middle">Matches skill gap</text><text x="393" y="433" class="head">→</text><rect x="430" y="400" width="322" height="51" rx="8" fill="#e9e7ff" stroke="#c7c0ff"/><text x="591" y="433" class="row purple" text-anchor="middle">High learning value</text>
<rect x="88" y="463" width="290" height="51" rx="8" fill="#fff" stroke="#dedaf5"/><text x="233" y="496" class="row" text-anchor="middle">Requires real judgement</text><text x="393" y="496" class="head">→</text><rect x="430" y="463" width="322" height="51" rx="8" fill="#e9e7ff" stroke="#c7c0ff"/><text x="591" y="496" class="row purple" text-anchor="middle">Good practice opportunity</text>
<rect x="88" y="526" width="290" height="51" rx="8" fill="#fff" stroke="#dedaf5"/><text x="233" y="559" class="row" style="font-size:18px" text-anchor="middle">New or more complex context</text><text x="393" y="559" class="head">→</text><rect x="430" y="526" width="322" height="51" rx="8" fill="#e9e7ff" stroke="#c7c0ff"/><text x="591" y="559" class="row purple" text-anchor="middle">Broadens experience</text>
<rect x="88" y="589" width="290" height="51" rx="8" fill="#fff" stroke="#dedaf5"/><text x="233" y="622" class="row" text-anchor="middle">Skill already mastered</text><text x="393" y="622" class="head">→</text><rect x="430" y="589" width="322" height="51" rx="8" fill="#e9e7ff" stroke="#c7c0ff"/><text x="591" y="622" class="row purple" text-anchor="middle">Low learning value</text>
<rect x="820" y="289" width="720" height="390" rx="16" fill="#f7f6f3" stroke="#c8c1b9"/>
<circle cx="864" cy="334" r="24" fill="#e6e2de"/><text x="864" y="344" class="head brown" text-anchor="middle">B</text>
<text x="906" y="343" class="head">Business constraints</text>
<text x="848" y="372" class="detail">What needs to be considered for business execution?</text>
<rect x="848" y="400" width="290" height="51" rx="8" fill="#fff" stroke="#e4e0dc"/><text x="993" y="433" class="row" text-anchor="middle">Low risk and low impact</text><text x="1153" y="433" class="head">→</text><rect x="1190" y="400" width="322" height="51" rx="8" fill="#f8efe5" stroke="#e9d2b8"/><text x="1351" y="433" class="row brown" text-anchor="middle">Can assign to junior employee</text>
<rect x="848" y="463" width="290" height="51" rx="8" fill="#fff" stroke="#e4e0dc"/><text x="993" y="496" class="row" text-anchor="middle">High risk or high impact</text><text x="1153" y="496" class="head">→</text><rect x="1190" y="463" width="322" height="51" rx="8" fill="#f8efe5" stroke="#e9d2b8"/><text x="1351" y="496" class="row brown" text-anchor="middle">Requires senior ownership</text>
<rect x="848" y="526" width="290" height="51" rx="8" fill="#fff" stroke="#e4e0dc"/><text x="993" y="559" class="row" text-anchor="middle">Needs specific approval</text><text x="1153" y="559" class="head">→</text><rect x="1190" y="526" width="322" height="51" rx="8" fill="#f8efe5" stroke="#e9d2b8"/><text x="1351" y="559" class="row brown" text-anchor="middle">Requires senior ownership</text>
<rect x="848" y="589" width="290" height="51" rx="8" fill="#fff" stroke="#e4e0dc"/><text x="993" y="622" class="row" text-anchor="middle">Routine and repeatable</text><text x="1153" y="622" class="head">→</text><rect x="1190" y="589" width="322" height="51" rx="8" fill="#f8efe5" stroke="#e9d2b8"/><text x="1351" y="622" class="row brown" text-anchor="middle">Can go to automation</text>
<path d="M420 679V711H800M1180 679V711H800" fill="none" stroke="#555a65" stroke-width="2.5"/>
<g fill="none" stroke="#555a65" stroke-width="2.5" marker-end="url(#arrow)"><path d="M800 711H275V758"/><path d="M800 711V758"/><path d="M800 711H1325V758"/></g>
<rect x="60" y="769" width="430" height="102" rx="13" fill="#eaf6ff" stroke="#8bc8ed"/>
<text x="275" y="811" class="card" text-anchor="middle">Available for automation</text><text x="275" y="841" class="detail" text-anchor="middle">Limited learning value and routine work.</text>
<rect x="585" y="769" width="430" height="102" rx="13" fill="#e9f8f2" stroke="#68bda3"/>
<text x="800" y="811" class="card green" text-anchor="middle">Reserve for junior employee</text><text x="800" y="841" class="detail" text-anchor="middle">Valuable practice and appropriate risk.</text>
<rect x="1110" y="769" width="430" height="102" rx="13" fill="#f7f6f3" stroke="#c8c1b9"/>
<text x="1325" y="811" class="card" text-anchor="middle">Senior-led</text><text x="1325" y="841" class="detail" text-anchor="middle">High risk, high impact or senior expertise.</text>
<text x="275" y="909" class="small" text-anchor="middle">Sent to existing AI automation workflow</text>
<text x="800" y="909" class="small" text-anchor="middle">Assigned to junior employee</text>
<text x="1325" y="909" class="small" text-anchor="middle">Assigned to senior to handle</text>
</svg>
